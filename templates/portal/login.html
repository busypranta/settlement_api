{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7f5">
  <title>Sign in · Settlement Portal</title>
  <link rel="stylesheet" href="{% static 'portal/portal.css' %}">
  <link rel="icon" type="image/png" href="{% static 'favicon/favicon-96x96.png' %}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}" />
  <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png' %}" />
  <meta name="apple-mobile-web-app-title" content="JanataPay" />
  <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />
</head>
<body class="login-page">
  <main class="login-main">
    <div class="login-watermark" aria-hidden="true">JanataPay</div>
    <section class="login-card">
      <div class="login-logo">
        <img src="{% static 'images/jpay.webp' %}" alt="JanataPay" class="login-card-logo" />
      </div>
      {% if form.errors %}
        <div class="form-alert" role="alert" style="margin-bottom: 15px;"><span aria-hidden="true">⚠</span> Please check your username and password.</div>
      {% endif %}
      <form method="post" class="login-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="login-field">
          <label for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }}
        </div>
        <div class="login-field">
          <label for="{{ form.password.id_for_label }}">Password</label>
          <div class="password-field-wrap">
            {{ form.password }}
            <button class="password-toggle" type="button" data-target="{{ form.password.id_for_label }}" aria-label="Show password">👁</button>
          </div>
        </div>
        <button class="button button-primary login-submit" type="submit">Log in to your account <span>→</span></button>
      </form>
      <div class="login-divider"><span></span><i>PORTAL ACCESS</i><span></span></div>
    </section>
  </main>
  <footer class="login-footer"><span>© {% now "Y" %} Janata Bank PLC.</span><span>Need access? Contact JanataPay.</span></footer>
  <script>
    document.querySelectorAll('.password-toggle').forEach((toggle) => {
      const field = document.getElementById(toggle.dataset.target);
      if (!field) return;
      toggle.addEventListener('click', () => {
        const hidden = field.type === 'password';
        field.type = hidden ? 'text' : 'password';
        toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
        toggle.textContent = hidden ? '🙈' : '👁';
      });
    });
  </script>
</body>
</html>
